# docker-compose.standby.yml — PostgreSQL streaming replication standby
# Originally: runs on HSH-HQ (10.99.0.1) to maintain a hot standby of the
# DroneOps primary database running on CHAD-HQ (10.99.0.2:5434).
#
# ⚠ STATUS 2026-09-21 — THIS FILE DESCRIBES THE PRE-2026-04-20 TOPOLOGY.
# The direction inverted during the HSH-HQ → BOS-HQ migration. Live today
# (verified 2026-09-21 via `pg_stat_replication` on the primary):
#     PRIMARY  = BOS-HQ 10.99.0.4, container `droneops-standby-db`
#                (a promoted former standby; the name is historical)
#     STANDBY  = 10.99.0.2 (CHAD-HQ), application_name `chad_hq_standby`
# So the `host=10.99.0.2` in `primary_conninfo` below points at the STANDBY,
# not the primary, and `application_name=hsh_hq_standby` is not the name the
# live standby registers under. Do NOT bring this file up as-is: set the
# primary host to the real primary first. Kept because it is the reviewed,
# secret-free shape of a standby for this stack (ADR-0012 guards intact).
#
# Usage:
#   docker compose -f docker-compose.standby.yml up -d
#
# First-time setup requires pg_basebackup (see scripts/init-standby.sh).

services:
  db-standby:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGDATA: /var/lib/postgresql/data
      # ADR-0012: required, no default. Substituted into primary_conninfo below.
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?REPLICATION_PASSWORD must be set in .env (no default — see ADR-0012)}
    volumes:
      - droneops_standby_pgdata:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    # primary_conninfo is interpolated by docker compose at start time. The
    # password literal that used to live here was removed in ADR-0012.
    command: >
      postgres
        -c hot_standby=on
        -c primary_conninfo='host=10.99.0.2 port=5434 user=replicator password=${REPLICATION_PASSWORD:?REPLICATION_PASSWORD must be set} application_name=hsh_hq_standby'
    healthcheck:
      # -U/-d must name a role+database that actually exist: pg_isready's
      # startup packet is rejected pre-auth when the database is missing, so
      # the old `-U replicator` (dbname defaults to the username; no such
      # database) made the server log `FATAL: database "replicator" does not
      # exist` every 10s (~8.5k lines/day of pure noise) while the check
      # still exited 0. Fixed 2026-07-19; droneops/droneops is the app
      # role+db, present on the standby via replication.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U droneops -d droneops || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  droneops_standby_pgdata:
    external: true
    name: droneops_standby_pgdata
