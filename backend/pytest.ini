[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    real_dns_resolution: opts a test out of the autouse _no_dynamic_proxy patch in test_client_ip.py so it exercises the real socket.gethostbyname path.
