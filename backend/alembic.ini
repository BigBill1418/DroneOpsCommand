# Alembic configuration for DroneOpsCommand (ADR-0022).
#
# The DATABASE URL is intentionally NOT hardcoded here. `alembic/env.py`
# resolves it at runtime from `app.config.settings.database_url` and
# strips the async driver suffix so migrations run over a synchronous
# psycopg2 connection (Alembic's migration context is synchronous; the
# app's runtime engine stays async). This keeps the single source of
# truth for the connection string in the app config / env, consistent
# with the fleet "secrets live in env / config, never in tracked files"
# convention.
#
# Migrations are normally invoked PROGRAMMATICALLY from the FastAPI
# lifespan (ADR-0022) via `app.db_migrations.run_migrations_sync`, which
# builds the Config object in code and points `script_location` at the
# `alembic/` dir next to this file. The CLI (`alembic upgrade head`,
# `alembic revision --autogenerate`) is supported for operator/dev use
# and reads the settings below.

[alembic]
# Path to migration scripts, relative to this file's directory.
script_location = alembic

# Template used to generate migration file names; date-prefixed for
# chronological ordering in the versions/ dir.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Use OS-native path separators in version locations.
version_path_separator = os

# sqlalchemy.url is left blank on purpose — env.py injects it from
# app.config at runtime (CLI and programmatic paths both go through
# env.py). A blank value here means the CLI will not silently run
# against the wrong DB if env.py's resolution is ever bypassed.
sqlalchemy.url =


[post_write_hooks]
# No post-write hooks (no black/isort auto-format on generated files).


# Logging configuration. Alembic's own logger; the app configures
# structured JSON logging separately at import time (app/main.py).
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
